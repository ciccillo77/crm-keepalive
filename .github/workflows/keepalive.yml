name: Keep Supabase Alive

on:
  schedule:
    - cron: '0 6 * * *'    # OGNI GIORNO alle 06:00 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Scarica il repository
        uses: actions/checkout@v5

      - name: Scrittura sul database Supabase (attività reale)
        run: |
          ORA=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          RISPOSTA=$(curl -s -o /dev/null -w "%{http_code}" -X PATCH \
            -H "apikey: sb_publishable_I9_bWA5ImylRy1Vw6l7QAg_LrTYYYDU" \
            -H "Content-Type: application/json" \
            -H "Prefer: return=minimal" \
            -d "{\"ping\":\"$ORA\"}" \
            "https://etjjluzilzoyvfzpqydd.supabase.co/rest/v1/keep_alive?id=eq.1")
          echo "Risposta HTTP: $RISPOSTA"
          if [ "$RISPOSTA" != "204" ] && [ "$RISPOSTA" != "200" ]; then
            echo "ERRORE: la scrittura non e' riuscita (atteso 204)."
            exit 1
          fi
          echo "Scrittura riuscita, database attivo."

      - name: Registra attività (evita il blocco 60 giorni di GitHub)
        run: |
          mkdir -p .keepalive
          date -u > .keepalive/ultima-esecuzione.txt
          git config user.name "keepalive-bot"
          git config user.email "keepalive-bot@users.noreply.github.com"
          git add .keepalive/ultima-esecuzione.txt
          git commit -m "keep-alive $(date -u +%Y-%m-%d)" || echo "Nessuna modifica da committare"
          git push || echo "Push non necessario"
