name: Keep Supabase Alive

on:
  schedule:
    - cron: '0 6 */3 * *'   # ogni 3 giorni alle 06:00 UTC
  workflow_dispatch:

permissions:
  contents: write            # serve per scrivere il commit anti-60-giorni

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Scarica il repository
        uses: actions/checkout@v5

      - name: Ping del database Supabase
        run: |
          RISPOSTA=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "apikey: sb_publishable_I9_bWA5ImylRy1Vw6l7QAg_LrTYYYDU" \
            "https://etjjluzilzoyvfzpqydd.supabase.co/rest/v1/keep_alive?select=ping")
          echo "Risposta HTTP: $RISPOSTA"
          if [ "$RISPOSTA" != "200" ]; then
            echo "ERRORE: il ping non ha restituito 200."
            exit 1
          fi
          echo "Ping riuscito, database sveglio."

      - name: Registra attività (evita il blocco 60 giorni di GitHub)
        run: |
          mkdir -p .keepalive
          date -u > .keepalive/ultima-esecuzione.txt
          git config user.name "keepalive-bot"
          git config user.email "keepalive-bot@users.noreply.github.com"
          git add .keepalive/ultima-esecuzione.txt
          git commit -m "keep-alive $(date -u +%Y-%m-%d)" || echo "Nessuna modifica da committare"
          git push || echo "Push non necessario"
